<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tickmark</title>
  <meta name="description" content="Swing-trading research desk for the S&P 500">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tickmark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="Tickmark home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M7 21l6-6 4 4 8-9" fill="none" stroke="#0d1117" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="10" r="3" fill="#0d1117"/></svg>
      <span>Tickmark</span>
    </a>
    <form class="search" id="search" autocomplete="off">
      <input id="q" type="search" placeholder="Ticker or company" aria-label="Search ticker" list="tickers" autocapitalize="characters">
      <datalist id="tickers"></datalist>
    </form>
    <span class="asof" id="asof"></span>
  </header>

  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/today" data-r="today"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span>Today</span></a>
    <a href="#/best" data-r="best"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span>Best</span></a>
    <a href="#/fear" data-r="fear"><svg viewBox="0 0 24 24"><path d="M3 17a9 9 0 0 1 18 0"/><path d="M12 17l4-5"/></svg><span>F&amp;G</span></a>
    <a href="#/screener" data-r="screener"><svg viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></svg><span>Screener</span></a>
    <a href="#/t/SPY" data-r="t"><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/><circle cx="20" cy="7" r="1.5"/></svg><span>Chart</span></a>
    <a href="#/record" data-r="record"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Record</span></a>
  </nav>

  <main id="view" tabindex="-1"><div class="loading">Loading market data…</div></main>

  <script type="module" src="app.js"></script>
</body>
</html>
