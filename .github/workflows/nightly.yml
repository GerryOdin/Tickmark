# Runs after every US market close, rebuilds the data, and publishes the app to GitHub Pages.
name: Nightly update

on:
  schedule:
    - cron: "45 21 * * 1-5"   # 21:45 UTC = 4:45 pm ET (winter) / 5:45 pm ET (summer)
  workflow_dispatch: {}        # "Run workflow" button for manual runs
  push:
    branches: [main]           # rebuild whenever new code is uploaded

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/run.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
